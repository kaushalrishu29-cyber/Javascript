<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Simple Calculator</title>
   <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
        .calculator { background-color: #333; padding: 20px; border-radius: 10px; box-shadow: 0px 10px 20px rgba(0,0,0,0.3); width: 300px; }
        .display { width: 100%; height: 50px; font-size: 24px; text-align: right; margin-bottom: 10px; padding: 10px; box-sizing: border-box; border: none; border-radius: 5px; background: #eee; color: #333; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 20px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; background: #555; color: white; }
        button:hover { background: #777; }
        .operator { background: #f39c12; }
        .operator:hover { background: #e67e22; }
        .clear { background: #c0392b; grid-column: span 2; }
        .clear:hover { background: #a93226; }
        .zero { grid-column: span 2; }
    </style>
</head>
<body>


<div class="calculator">
    <!-- Static display placeholder -->
    <input type="text" class="display" value="0" readonly>
    
    <div class="buttons">
        <!-- Row 1 -->
        <button class="clear">C</button>
        <button class="operator">/</button>
        <button class="operator">×</button>
        
        <!-- Row 2 -->
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">-</button>
        
        <!-- Row 3 -->
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">+</button>
        
        <!-- Row 4 -->
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">=</button>
        
        <!-- Row 5 -->
        <button class="zero">0</button>
        <button>.</button>
    </div>
</div>


   <script src="./js/index.js" ></script> 
    
</body>
</html>
